name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'zmNinjaNg-*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # NDK version AGP uses to strip native libs and extract debug symbols for
      # the AAB (issue #244). Must be installed on the runner (step below).
      ANDROID_NDK_VERSION: '27.2.12479018'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git rev-list --count HEAD is the real versionCode

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android NDK
        # Required so debugSymbolLevel FULL can strip native .so and emit debug
        # symbols into the AAB; without it Play warns about missing symbols (#244).
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Sync version to platform configs
        run: node scripts/sync-version.js

      - name: Build web app
        working-directory: ./app
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./app
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/zmninja-ng-upload.jks

      - name: Build Android APK (release, signed)
        working-directory: ./app/android
        env:
          ZMNINJA_KEYSTORE_PATH: /tmp/zmninja-ng-upload.jks
          ZMNINJA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZMNINJA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZMNINJA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ZMNINJA_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: ./gradlew assembleRelease

      - name: Build Android App Bundle (AAB, release, signed)
        working-directory: ./app/android
        env:
          ZMNINJA_KEYSTORE_PATH: /tmp/zmninja-ng-upload.jks
          ZMNINJA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZMNINJA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZMNINJA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ZMNINJA_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: ./gradlew bundleRelease

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/zmninja-ng-upload.jks

      - name: Rename Android artifacts
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#zmNinjaNg-}"
          mkdir -p dist/android
          cp app/android/app/build/outputs/apk/release/*.apk dist/android/zmNinjaNg-${VERSION}-android.apk
          cp app/android/app/build/outputs/bundle/release/*.aab dist/android/zmNinjaNg-${VERSION}-android.aab
          cp app/android/app/build/outputs/mapping/release/mapping.txt dist/android/zmNinjaNg-${VERSION}-android-mapping.txt
          # Native debug symbols for Play native-crash symbolication (#244). AGP does
          # not embed them in the AAB and the output path varies, so locate them.
          echo "=== native symbol outputs under app build ==="
          find app/android/app/build \( -name "native-debug-symbols*.zip" -o -name "*.so.dbg" -o -name "*.so.sym" -o -path "*native_debug*" -o -path "*native_symbol*" \) 2>/dev/null | head -60 || true
          symzip=$(find app/android/app/build -name "native-debug-symbols*.zip" -type f 2>/dev/null | head -1)
          if [ -n "$symzip" ]; then
            echo "Found symbols zip: $symzip"
            cp "$symzip" dist/android/zmNinjaNg-${VERSION}-android-native-debug-symbols.zip
          elif find app/android/app/build -name "*.so.dbg" -o -name "*.so.sym" 2>/dev/null | grep -q .; then
            dbgroot=$(find app/android/app/build -path "*native_debug_metadata*" -o -path "*native_symbol_tables*" 2>/dev/null | grep -E "/out$" | head -1)
            echo "Packaging per-ABI symbols from: $dbgroot"
            ( cd "$dbgroot" && zip -qr - . ) > dist/android/zmNinjaNg-${VERSION}-android-native-debug-symbols.zip
            unzip -l dist/android/*-native-debug-symbols.zip | tail -8
          else
            echo "No native debug symbols were produced (dependency .so ship stripped)."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmNinjaNg-android-apk-${{ github.event.inputs.version || github.ref_name }}
          path: dist/android/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmNinjaNg-android-aab-${{ github.event.inputs.version || github.ref_name }}
          path: dist/android/*.aab
          retention-days: 30

      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmNinjaNg-android-mapping-${{ github.event.inputs.version || github.ref_name }}
          path: dist/android/*-mapping.txt
          retention-days: 90

      - name: Upload native debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmNinjaNg-android-native-debug-symbols-${{ github.event.inputs.version || github.ref_name }}
          path: dist/android/*-native-debug-symbols.zip
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/zmNinjaNg-')
        with:
          files: |
            dist/android/*.apk
            dist/android/*.aab
            dist/android/*-native-debug-symbols.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
